    <!-- Ensure window.fetch has a setter so extension interceptors and test harnesses can assign to window.fetch without throwing "Cannot set property fetch of #<Window> which has only a getter" -->
    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          var descriptor = {
            get: function() {
              return originalFetch;
            },
            set: function(val) {
              originalFetch = val;
            },
            configurable: true,
            enumerable: true
          };
          Object.defineProperty(window, 'fetch', descriptor);
          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', descriptor);
            } catch (_) {}
          }
        } catch (_) {}
      })();
    </script>

    <style>
      body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; overflow-x: hidden; max-width: 100%; background-color: #030305; font-family: 'Inter', sans-serif;}
      #root { width: 100%; height: 100%; overflow-x: hidden; }

      /* Decorative animation is disabled when the user asks for reduced motion. */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
      /* Custom scrollbar for overlay content */
      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(236,72,153,0.3); border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(236,72,153,0.6); }
      
      .custom-scrollbar::-webkit-scrollbar { width: 6px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 4px; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(6,182,212,0.3); border-radius: 4px; }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(6,182,212,0.6); }

      /* Mask gradient for smooth scroll fade */
      .mask-gradient {
        mask-image: linear-gradient(to right, transparent, black 5%, black 95%, transparent);
        -webkit-mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
      }

      /* Vignette & Scanline Global Polish */
      .vignette {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none;
        z-index: 40;
        background: radial-gradient(circle at center, transparent 40%, rgba(0, 0, 0, 0.45) 150%);
      }
      .scanlines {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none;
        z-index: 45;
        opacity: 0.15;
        background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.2));
        background-size: 100% 4px;
      }
    </style>
