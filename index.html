<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luis Martinez | Full Stack Creative Engineer &amp; 3D Web Developer</title>

    <!-- SEO -->
    <meta name="description" content="Interactive 3D portfolio of Luis Martinez, Full Stack Creative Engineer. Explore projects in React Three Fiber, TypeScript and AI, with a Gemini-powered assistant." />
    <meta name="author" content="Luis Martinez" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#030305" />
    <link rel="canonical" href="https://aerofolio-3d.vercel.app/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Luis Martinez | Full Stack Creative Engineer" />
    <meta property="og:description" content="An immersive 3D portfolio merging spatial interactivity with Generative AI." />
    <meta property="og:url" content="https://aerofolio-3d.vercel.app/" />
    <meta property="og:image" content="https://aerofolio-3d.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Luis Martinez | Full Stack Creative Engineer" />
    <meta name="twitter:description" content="An immersive 3D portfolio merging spatial interactivity with Generative AI." />
    <meta name="twitter:image" content="https://aerofolio-3d.vercel.app/og-image.png" />

    <!-- Preconnect and dns-prefetch for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <!-- GitHub profile data and avatars are fetched on load -->
    <link rel="preconnect" href="https://api.github.com">
    <link rel="dns-prefetch" href="https://avatars.githubusercontent.com">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
      body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; overflow-x: hidden; max-width: 100%; background-color: #030305; font-family: 'Inter', sans-serif;}
      #root { width: 100%; height: 100%; overflow-x: hidden; }

      /* Decorative animation is disabled when the user asks for reduced motion. */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
      /* Custom scrollbar for overlay content */
      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(236,72,153,0.3); border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(236,72,153,0.6); }
      
      .custom-scrollbar::-webkit-scrollbar { width: 6px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 4px; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(6,182,212,0.3); border-radius: 4px; }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(6,182,212,0.6); }

      /* Mask gradient for smooth scroll fade */
      .mask-gradient {
        mask-image: linear-gradient(to right, transparent, black 5%, black 95%, transparent);
        -webkit-mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
      }

      /* Vignette & Scanline Global Polish */
      .vignette {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none;
        z-index: 40;
        background: radial-gradient(circle at center, transparent 40%, rgba(0, 0, 0, 0.45) 150%);
      }
      .scanlines {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none;
        z-index: 45;
        opacity: 0.15;
        background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.2));
        background-size: 100% 4px;
      }
    </style>
    <!-- Restore path redirected via 404.html for SPA routing on GitHub Pages -->
    <script>
      (function() {
        var redirect = sessionStorage.getItem('redirect');
        sessionStorage.removeItem('redirect');
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
      })();
    </script>
    <!-- Shim process to prevent process is not defined errors in prod with Node SDKs -->
    <script>
      window.process = {
        env: {
          NODE_ENV: 'production'
        }
      };
    </script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
